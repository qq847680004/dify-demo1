      - id: normalize
        type: custom
        data:
          type: code
          title: "规范化 result_json"
          code_language: python3
          code: |
            import json
            import re

            STEPS = [
                {"code": "RECALL", "name": "检索召回", "progress": "done", "detail": "匹配运价中心有效运价 + 相似历史成交文案"},
                {"code": "RULES", "name": "规则引擎", "progress": "done", "detail": "按运输方式与进出口列出应报费用项，校验计费单位"},
                {"code": "LLM", "name": "LLM 合成", "progress": "done", "detail": "生成预填报价单草稿并注明依据"},
            ]
            HINT_BOTH = "本次费用按运价中心当前有效运价生成（最新运价）。匹配到的市场运价与相似历史单均已列出；报价金额以市场运价为准。每个费用项只报一行。"
            HINT_RATE = "本次费用按运价中心当前有效运价生成（最新运价）。未匹配到足够相似的历史关闭单，故无上浮/下跌对照。"
            HINT_HIST = "当前没有匹配的最新运价，本次费用按相似历史订单报价生成，仅供参考。建议在运价中心补充有效运价或联系管理员。"
            HINT_DETAIL = "请提供更详细的询价信息（港口、运输方式、箱型/货量、品名等），以获得更精准的报价。"
            HINT_NO_RATE = "请补充运价中心的数据或联系管理员。"


            def peel(text):
                t = (text or "").strip()
                t = re.sub(r"^```(?:json)?\s*", "", t, flags=re.I)
                t = re.sub(r"\s*```$", "", t)
                return t.strip()


            def num(v, default=0.0):
                try:
                    if v is None or v == "":
                        return default
                    return float(v)
                except Exception:
                    return default


            def main(llm_text: str = "", analyzed_json: str = "", recall_ok: float = 0, info_insufficient: float = 0, skip_rate: float = 0) -> dict:
                analyzed = {}
                try:
                    analyzed = json.loads(analyzed_json or "{}")
                except Exception:
                    analyzed = {}
                if not isinstance(analyzed, dict):
                    analyzed = {}
                for k, d in (
                    ("ioDirection", 0),
                    ("ioDirectionLabel", ""),
                    ("logisticsType", ""),
                    ("rateType", ""),
                    ("rateTypeLabel", ""),
                    ("queryText", ""),
                    ("containerTypes", []),
                    ("selectedSpec", ""),
                    ("quantity", 0),
                    ("skipRate", False),
                    ("specGuessed", False),
                    ("carrier", ""),
                    ("routeName", ""),
                    ("country", ""),
                    ("transitType", ""),
                ):
                    if k not in analyzed:
                        analyzed[k] = d
                failed = False
                obj = None
                try:
                    obj = json.loads(peel(llm_text))
                except Exception:
                    failed = True
                if not isinstance(obj, dict):
                    failed = True
                    obj = {}
                fees = obj.get("fees") if isinstance(obj.get("fees"), list) else []
                clean_fees = []
                for row in fees:
                    if not isinstance(row, dict):
                        continue
                    qty = num(row.get("quantity"), 1.0)
                    price = num(row.get("unitPrice"), 0.0)
                    amount = round(price * qty, 2)
                    nv = row.get("needVerify")
                    if not isinstance(nv, bool):
                        nv = False
                    sf = row.get("selectedFlag")
                    try:
                        sf = int(sf)
                    except Exception:
                        sf = 1 if price > 0 else 0
                    rf = row.get("requiredFlag")
                    try:
                        rf = int(rf)
                    except Exception:
                        rf = 1
                    st = str(row.get("sourceType") or "")
                    if st not in ("RATE", "HISTORY", "DIFY"):
                        st = "DIFY" if price == 0 else "RATE"
                    clean_fees.append({
                        "feeName": str(row.get("feeName") or ""),
                        "unitPrice": round(price, 2),
                        "quantity": qty,
                        "currencyCode": str(row.get("currencyCode") or "USD"),
                        "amount": amount,
                        "remark": str(row.get("remark") or ""),
                        "sourceType": st,
                        "chargeUnit": str(row.get("chargeUnit") or ""),
                        "requiredFlag": rf,
                        "selectedFlag": sf,
                        "needVerify": nv,
                        "trendText": str(row.get("trendText") or ""),
                    })
                if failed:
                    clean_fees = []
                total = 0.0
                cur = str(obj.get("totalCurrency") or "USD")
                for row in clean_fees:
                    if row["selectedFlag"] == 1 and row["unitPrice"] > 0:
                        total += row["amount"]
                        if row.get("currencyCode"):
                            cur = row["currencyCode"]
                spec_guessed = bool(analyzed.get("specGuessed"))
                if spec_guessed:
                    for row in clean_fees:
                        if row["sourceType"] == "RATE" and "默认" not in row["remark"]:
                            row["needVerify"] = True
                            if row["remark"]:
                                row["remark"] = row["remark"] + " 规格按 %s 默认" % (analyzed.get("selectedSpec") or "40HQ")
                            else:
                                row["remark"] = "规格按 %s 默认" % (analyzed.get("selectedSpec") or "40HQ")
                hint = str(obj.get("hint") or "")
                if failed:
                    hint = HINT_NO_RATE
                mr = obj.get("marketRates") if isinstance(obj.get("marketRates"), list) else []
                sq = obj.get("similarQuotes") if isinstance(obj.get("similarQuotes"), list) else []
                if failed:
                    mr, sq = [], []
                steps = [dict(x) for x in STEPS]
                if failed:
                    steps[2]["progress"] = "failed"
                has_r = bool(mr) and not int(float(skip_rate or 0))
                has_h = bool(sq)
                if not has_r and not has_h:
                    hint = HINT_NO_RATE
                elif not has_r and has_h:
                    hint = HINT_HIST
                elif not hint:
                    hint = HINT_BOTH if has_h else HINT_RATE
                if has_r and spec_guessed and HINT_DETAIL not in hint:
                    hint = (hint + " " + HINT_DETAIL).strip()
                out = {
                    "analyzed": analyzed,
                    "steps": steps,
                    "fees": clean_fees,
                    "totalAmount": round(total, 2),
                    "totalCurrency": cur or "USD",
                    "hint": hint,
                    "marketRates": mr,
                    "similarQuotes": sq,
                    "competitorHint": None,
                }
                return {"result_json": json.dumps(out, ensure_ascii=False)}
          variables:
            - variable: llm_text
              value_selector: [synthesize, text]
            - variable: analyzed_json
              value_selector: [assemble, analyzed_json]
            - variable: recall_ok
              value_selector: [pack_context, recall_ok]
            - variable: info_insufficient
              value_selector: [assemble, info_insufficient]
            - variable: skip_rate
              value_selector: [assemble, skip_rate]
          outputs:
            result_json:
              type: string
              children: null
