version: "0.7.0"
kind: app
app:
  name: "AI 报价推荐引擎"
  description: "根据询价单基础字段与可选补充信息召回有效运价、相似历史单与费用项，合成可解释的报价草案 JSON"
  icon: "💹"
  icon_type: emoji
  icon_background: "#E4FBCC"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.15@1df8bd27d67c149e6db3c210830ef6e3857c5a9df5e8edbe9e785b995f337ef5
      version: null
workflow:
  conversation_variables: []
  environment_variables:
    - description: "本地测试：AI 数据网关前缀"
      id: a1b2c3d4-0001-4000-8000-aidatabaseurl01
      name: AIDATA_BASE_URL
      selector: [env, AIDATA_BASE_URL]
      value: "http://182.168.0.247:9999/aidata"
      value_type: string
    - description: "本地测试：Nacos aidata.agent.api-key，不是百炼 aidata.embedding.api-key"
      id: a1b2c3d4-0002-4000-8000-aidataapikey001
      name: AIDATA_API_KEY
      selector: [env, AIDATA_API_KEY]
      value: "aidata-agent-dev-20260920"
      value_type: secret
    - description: "本地测试：请求头 TENANT-ID"
      id: a1b2c3d4-0003-4000-8000-aidatatenantid1
      name: AIDATA_TENANT_ID
      selector: [env, AIDATA_TENANT_ID]
      value: "1"
      value_type: string
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "询价基础字段"
          variables:
            - label: "询价号"
              variable: inquiry_no
              type: text-input
              required: false
              max_length: 32
            - label: "客户名称"
              variable: customer_name
              type: text-input
              required: true
              max_length: 100
            - label: "运输方式"
              variable: logistics_type
              type: text-input
              required: true
              max_length: 32
            - label: "起运港码"
              variable: origin_port_code
              type: text-input
              required: true
              max_length: 32
            - label: "目的港码"
              variable: dest_port_code
              type: text-input
              required: true
              max_length: 32
            - label: "起运港名称"
              variable: origin_port_name
              type: text-input
              required: true
              max_length: 128
            - label: "目的港名称"
              variable: dest_port_name
              type: text-input
              required: true
              max_length: 128
            - label: "品名"
              variable: cargo_name
              type: text-input
              required: false
              max_length: 200
            - label: "货品规格"
              variable: cargo_spec
              type: text-input
              required: false
              max_length: 200
            - label: "报价条款"
              variable: quote_terms
              type: text-input
              required: false
              max_length: 32
            - label: "服务范围"
              variable: service_scope
              type: text-input
              required: false
              max_length: 200
            - label: "紧急程度"
              variable: urgency_level
              type: text-input
              required: false
              max_length: 32
            - label: "补充信息"
              variable: supplement
              type: paragraph
              required: false
              max_length: 1000
        position: {x: 40, y: 280}
        positionAbsolute: {x: 40, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 140
      - id: join_inquiry
        type: custom
        data:
          type: template-transform
          title: "拼接询价基础字段"
          variables:
            - variable: logistics_type
              value_selector: [start, logistics_type]
            - variable: origin_port_code
              value_selector: [start, origin_port_code]
            - variable: dest_port_code
              value_selector: [start, dest_port_code]
            - variable: origin_port_name
              value_selector: [start, origin_port_name]
            - variable: dest_port_name
              value_selector: [start, dest_port_name]
            - variable: cargo_name
              value_selector: [start, cargo_name]
            - variable: cargo_spec
              value_selector: [start, cargo_spec]
            - variable: quote_terms
              value_selector: [start, quote_terms]
            - variable: service_scope
              value_selector: [start, service_scope]
            - variable: supplement
              value_selector: [start, supplement]
          template: |
            运输方式: {{ logistics_type }}
            起运港码: {{ origin_port_code }}
            目的港码: {{ dest_port_code }}
            起运港名称: {{ origin_port_name }}
            目的港名称: {{ dest_port_name }}
            品名: {{ cargo_name }}
            规格: {{ cargo_spec }}
            条款: {{ quote_terms }}
            服务范围: {{ service_scope }}
            补充信息: {{ supplement }}
        position: {x: 340, y: 80}
        positionAbsolute: {x: 340, y: 80}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 80
      - id: infer_route
        type: custom
        data:
          type: parameter-extractor
          title: "判定进出口与运价类型"
          instruction: |
            从询价基础字段与补充信息判定进出口、运价类型、不规范规格归一。禁止改写运输方式，禁止手写货运类型码，禁止解析船司航线码头。
            io_direction：1=出口，2=进口；推不出则 1。条款/服务范围不得推翻港码（港码由下游规则覆盖）。
            rate_type 只能是：FBA, DUAL, PORT, FCL_FEEDER, SPECIAL_EXPORT, REEFER_EXPORT, FCL_EXPORT, FCL_IMPORT, LCL_EXPORT, LCL_IMPORT, AIR_EXPORT, RAIL。禁止传 SEA。
            空运进口 / 汽运 / 多式联运无主表 → skip_rate=true 且 rate_type 空。空运出口 → AIR_EXPORT。铁运 → RAIL。
            海运：整箱/FCL→FCL_*；拼箱/LCL/CBM/TON→LCL_*；都没有则默认 FCL_*（按进出口），skip_rate=false。柜型读不出可填 40HQ（默认猜）。箱量读不出填 1。
            服务范围 FBA/双清/集港/驳船优先。特种 OT/FR+出口→SPECIAL_EXPORT；冷冻 RF+出口→REEFER_EXPORT。
            skip_rate 仅当没有对应主表。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.7-flash-2026-07-15
            mode: chat
            completion_params:
              temperature: 0.1
              enable_thinking: false
          parameters:
            - name: io_direction
              type: number
              description: "1 出口 2 进口；港码能推出时仍可给参考值"
              required: false
            - name: rate_type
              type: string
              description: "运价类型枚举，选不出则空"
              required: false
            - name: container_type
              type: string
              description: "归一规格代码如 40HQ，读不出则空"
              required: false
            - name: quantity
              type: number
              description: "箱量，读不出为 0"
              required: false
            - name: skip_rate
              type: boolean
              description: "无法选运价表时 true"
              required: false
          query: [join_inquiry, output]
          reasoning_mode: prompt
          vision:
            enabled: false
        position: {x: 640, y: 80}
        positionAbsolute: {x: 640, y: 80}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: need_supp
        type: custom
        data:
          type: if-else
          title: "补充信息是否非空"
          cases:
            - id: has_supp
              case_id: has_supp
              logical_operator: and
              conditions:
                - id: supp-not-empty
                  variable_selector: [start, supplement]
                  comparison_operator: not empty
                  value: ""
                  varType: string
        position: {x: 340, y: 420}
        positionAbsolute: {x: 340, y: 420}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 126
      - id: parse_supplement
        type: custom
        data:
          type: parameter-extractor
          title: "解析补充信息"
          instruction: |
            只读补充信息，抽出写明的线索。没写明的键必须空字符串，禁止猜测 MSC/直达/美国。禁止把「尽量快」写成直达，禁止把品名写成船司，禁止用船期冒充 transit_type。
            carrier：船司/航司原文。route_name：航线名如美西。route_code：航线代码。country：目的国原文，不擅自改 ISO。
            transit_type：仅用户明确时填 直达 或 中转。origin_terminal/dest_terminal：码头。schedule_note：船期/班期原文。spec_hint：补充信息里的规格线索。
            运输方式与规格仅作消歧，不得改写港码。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.7-flash-2026-07-15
            mode: chat
            completion_params:
              temperature: 0.1
              enable_thinking: false
          parameters:
            - name: carrier
              type: string
              description: "船司/航司原文，未写明则空"
              required: false
            - name: route_name
              type: string
              description: "航线名，未写明则空"
              required: false
            - name: route_code
              type: string
              description: "航线代码，未写明则空"
              required: false
            - name: country
              type: string
              description: "国家原文，未写明则空"
              required: false
            - name: transit_type
              type: string
              description: "仅直达或中转，未写明则空"
              required: false
            - name: origin_terminal
              type: string
              description: "起运码头，未写明则空"
              required: false
            - name: dest_terminal
              type: string
              description: "目的码头，未写明则空"
              required: false
            - name: schedule_note
              type: string
              description: "船期原文，未写明则空"
              required: false
            - name: spec_hint
              type: string
              description: "补充信息中的规格线索，未写明则空"
              required: false
          query: [start, supplement]
          reasoning_mode: prompt
          vision:
            enabled: false
        position: {x: 640, y: 320}
        positionAbsolute: {x: 640, y: 320}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: pack_supp
        type: custom
        data:
          type: code
          title: "打包补充信息"
          code_language: python3
          code: |
            import json

            def s(v):
                return "" if v is None else str(v).strip()

            def main(
                carrier: str = "",
                route_name: str = "",
                route_code: str = "",
                country: str = "",
                transit_type: str = "",
                origin_terminal: str = "",
                dest_terminal: str = "",
                schedule_note: str = "",
                spec_hint: str = "",
            ) -> dict:
                payload = {
                    "carrier": s(carrier),
                    "route_name": s(route_name),
                    "route_code": s(route_code),
                    "country": s(country),
                    "transit_type": s(transit_type) if s(transit_type) in ("直达", "中转") else "",
                    "origin_terminal": s(origin_terminal),
                    "dest_terminal": s(dest_terminal),
                    "schedule_note": s(schedule_note),
                    "spec_hint": s(spec_hint),
                }
                return {"supp_json": json.dumps(payload, ensure_ascii=False)}
          variables:
            - variable: carrier
              value_selector: [parse_supplement, carrier]
            - variable: route_name
              value_selector: [parse_supplement, route_name]
            - variable: route_code
              value_selector: [parse_supplement, route_code]
            - variable: country
              value_selector: [parse_supplement, country]
            - variable: transit_type
              value_selector: [parse_supplement, transit_type]
            - variable: origin_terminal
              value_selector: [parse_supplement, origin_terminal]
            - variable: dest_terminal
              value_selector: [parse_supplement, dest_terminal]
            - variable: schedule_note
              value_selector: [parse_supplement, schedule_note]
            - variable: spec_hint
              value_selector: [parse_supplement, spec_hint]
          outputs:
            supp_json:
              type: string
              children: null
        position: {x: 940, y: 320}
        positionAbsolute: {x: 940, y: 320}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 100
      - id: empty_supp
        type: custom
        data:
          type: code
          title: "空补充信息"
          code_language: python3
          code: |
            import json

            def main(inquiry_no: str = "") -> dict:
                payload = {
                    "carrier": "", "route_name": "", "route_code": "", "country": "",
                    "transit_type": "", "origin_terminal": "", "dest_terminal": "",
                    "schedule_note": "", "spec_hint": "",
                }
                return {"supp_json": json.dumps(payload, ensure_ascii=False)}
          variables:
            - variable: inquiry_no
              value_selector: [start, inquiry_no]
          outputs:
            supp_json:
              type: string
              children: null
        position: {x: 640, y: 560}
        positionAbsolute: {x: 640, y: 560}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 80
      - id: agg_supp
        type: custom
        data:
          type: variable-aggregator
          title: "合并补充信息"
          output_type: string
          variables:
            - [pack_supp, supp_json]
            - [empty_supp, supp_json]
          advanced_settings:
            group_enabled: false
            groups: []
        position: {x: 1240, y: 420}
        positionAbsolute: {x: 1240, y: 420}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 80
      - id: assemble
        type: custom
        data:
          type: code
          title: "组装检索 Body"
          code_language: python3
          code: |
            import json
            import re

            RATE_ENUM = {
                "FBA", "DUAL", "PORT", "FCL_FEEDER", "SPECIAL_EXPORT", "REEFER_EXPORT",
                "FCL_EXPORT", "FCL_IMPORT", "LCL_EXPORT", "LCL_IMPORT", "AIR_EXPORT", "RAIL",
            }
            RATE_PORT_NAME_ONLY = {
                "AIR_EXPORT", "SPECIAL_EXPORT", "REEFER_EXPORT",
                "FCL_IMPORT", "LCL_IMPORT", "RAIL", "FBA", "DUAL", "PORT", "FCL_FEEDER",
            }
            RATE_LABEL = {
                "FBA": "FBA", "DUAL": "双清", "PORT": "集港", "FCL_FEEDER": "驳船",
                "SPECIAL_EXPORT": "出口特种", "REEFER_EXPORT": "出口冷冻",
                "FCL_EXPORT": "出口整箱", "FCL_IMPORT": "进口整箱",
                "LCL_EXPORT": "出口拼箱", "LCL_IMPORT": "进口拼箱",
                "AIR_EXPORT": "出口空运", "RAIL": "铁路",
            }
            BOX = "20GP|40GP|40HQ|45HQ|40NOR|20OT|40OT|20FR|40FR|20RF|40RF|40RH|45GP|20HQ"
            BOX_RE = re.compile(r"(\d+)\s*[x×]\s*(" + BOX + r")", re.I)
            BARE_BOX_RE = re.compile(r"(" + BOX + r")", re.I)
            CBM_RE = re.compile(r"(\d+(?:\.\d+)?)\s*(CBM|cbm|方)")
            TON_RE = re.compile(r"(\d+(?:\.\d+)?)\s*(TON|ton|吨)")
            MONEY_RE = re.compile(r"(USD|CNY|EUR|HKD|人民币|美金|美元|欧元)?\s*[¥$€]?\s*\d[\d,]*(\.\d+)?")


            def s(v):
                return "" if v is None else str(v).strip()


            def n(v, default=0):
                try:
                    if v is None or v == "":
                        return default
                    return int(float(v))
                except Exception:
                    return default


            def port_cc(code):
                c = s(code).upper()
                return c[:2] if len(c) >= 2 else ""


            def norm_logistics(raw):
                t = s(raw).upper()
                zh = s(raw)
                if t in ("AIR",) or "空运" in zh:
                    return "AIR"
                if t in ("SEA", "SEA_FCL", "SEA_LCL") or "海运" in zh:
                    return "SEA"
                if t in ("RAIL",) or "铁运" in zh or "铁路" in zh:
                    return "RAIL"
                if t in ("ROAD", "EXPRESS") or "汽运" in zh:
                    return "ROAD"
                if t in ("MULTIMODAL",) or "多式联运" in zh:
                    return "MULTIMODAL"
                return ""


            def parse_spec(text):
                types = []
                qty = 0
                for m in BOX_RE.finditer(text or ""):
                    q = int(m.group(1))
                    ct = m.group(2).upper()
                    qty += q
                    if ct not in types:
                        types.append(ct)
                if not types:
                    for m in BARE_BOX_RE.finditer(text or ""):
                        ct = m.group(1).upper()
                        if ct not in types:
                            types.append(ct)
                    if types:
                        qty = 1
                cbm = CBM_RE.search(text or "")
                ton = TON_RE.search(text or "")
                return types, qty, bool(cbm), bool(ton)


            def alias_spec(text):
                t = s(text)
                types = []
                if "高柜" in t or "HQ" in t.upper():
                    types.append("40HQ")
                if "平柜" in t or re.search(r"40\s*GP", t, re.I):
                    types.append("40GP")
                if "开顶" in t or re.search(r"\bOT\b", t, re.I):
                    types.append("20OT")
                if "框架" in t or re.search(r"\bFR\b", t, re.I):
                    types.append("20FR")
                if "冷冻" in t or "reefer" in t.lower() or re.search(r"\bRF\b", t, re.I):
                    types.append("20RF")
                qty = 0
                m = re.search(r"(\d+)\s*(个|只|台|柜)?", t)
                if m:
                    qty = int(m.group(1))
                return types, qty


            def pick_rate(logistics, io_dir, spec_text, service, container_types, has_vol, infer_rate):
                svc = s(service)
                up = svc.upper()
                if "FBA" in up:
                    return "FBA"
                if "双清" in svc:
                    return "DUAL"
                if "集港" in svc:
                    return "PORT"
                if "驳船" in svc:
                    return "FCL_FEEDER"
                raw = s(spec_text)
                blob = (raw + " " + " ".join(container_types)).upper()
                special = any(x in blob for x in ("OT", "FR")) or ("开顶" in raw) or ("框架" in raw)
                reefer = any(x in blob for x in ("RF", "REEFER")) or ("冷冻" in raw)
                fcl = bool(container_types) or "FCL" in blob or "整箱" in raw
                lcl = has_vol or "LCL" in blob or "拼箱" in raw or "CBM" in blob or "TON" in blob
                if logistics == "AIR":
                    return "AIR_EXPORT" if io_dir == 1 else ""
                if logistics == "RAIL":
                    return "RAIL"
                if logistics in ("ROAD", "MULTIMODAL"):
                    return ""
                if logistics == "SEA":
                    if special and io_dir == 1:
                        return "SPECIAL_EXPORT"
                    if reefer and io_dir == 1:
                        return "REEFER_EXPORT"
                    if fcl and io_dir == 1:
                        return "FCL_EXPORT"
                    if fcl and io_dir == 2:
                        return "FCL_IMPORT"
                    if lcl and io_dir == 1:
                        return "LCL_EXPORT"
                    if lcl and io_dir == 2:
                        return "LCL_IMPORT"
                    return "FCL_EXPORT" if io_dir == 1 else "FCL_IMPORT"
                ir = s(infer_rate).upper()
                return ir if ir in RATE_ENUM else ""


            def biz_of(logistics, io_dir):
                if logistics == "AIR":
                    return "AIR_EXPORT" if io_dir == 1 else "AIR_IMPORT"
                if logistics == "SEA":
                    return "SEA_EXPORT" if io_dir == 1 else "SEA_IMPORT"
                if logistics == "ROAD":
                    return "TRUCK_EXPORT" if io_dir == 1 else "TRUCK_IMPORT"
                if logistics == "RAIL":
                    return "RAIL_EXPORT" if io_dir == 1 else "RAIL_IMPORT"
                if logistics == "MULTIMODAL":
                    return "INTERMODAL"
                return ""


            def put(d, k, v):
                if v is None:
                    return
                if isinstance(v, str) and not v.strip():
                    return
                if isinstance(v, list) and not v:
                    return
                d[k] = v


            def put_ports(d, origin_code, origin_name, dest_code, dest_name, use_name_only):
                if origin_code and not use_name_only:
                    d["originPortCode"] = origin_code
                elif origin_name:
                    d["originPortName"] = origin_name
                if dest_code and not use_name_only:
                    d["destPortCode"] = dest_code
                elif dest_name:
                    d["destPortName"] = dest_name


            def main(
                inquiry_no: str = "",
                customer_name: str = "",
                logistics_type: str = "",
                origin_port_code: str = "",
                dest_port_code: str = "",
                origin_port_name: str = "",
                dest_port_name: str = "",
                cargo_name: str = "",
                cargo_spec: str = "",
                quote_terms: str = "",
                service_scope: str = "",
                supplement: str = "",
                infer_io: float = 0,
                infer_rate: str = "",
                infer_container: str = "",
                infer_qty: float = 0,
                supp_json: str = "",
            ) -> dict:
                opc = s(origin_port_code).upper()
                dpc = s(dest_port_code).upper()
                op = s(origin_port_name)
                dp = s(dest_port_name)
                spec = s(cargo_spec)
                svc = s(service_scope)
                logi = norm_logistics(logistics_type)
                try:
                    supp = json.loads(supp_json or "{}")
                except Exception:
                    supp = {}
                if not isinstance(supp, dict):
                    supp = {}
                carrier = s(supp.get("carrier"))
                route_name = s(supp.get("route_name"))
                route_code = s(supp.get("route_code"))
                country = s(supp.get("country"))
                transit = s(supp.get("transit_type"))
                if transit not in ("直达", "中转"):
                    transit = ""
                origin_terminal = s(supp.get("origin_terminal"))
                dest_terminal = s(supp.get("dest_terminal"))
                schedule_note = s(supp.get("schedule_note"))
                spec_hint = s(supp.get("spec_hint"))
                blob_text = " ".join([spec, spec_hint, svc, s(supplement)])
                types, qty, has_cbm, has_ton = parse_spec(blob_text)
                if not types:
                    a_types, a_qty = alias_spec(blob_text)
                    for t in a_types:
                        if t not in types:
                            types.append(t)
                    if not qty:
                        qty = a_qty
                ic = s(infer_container).upper()
                if ic and ic not in types and re.fullmatch(BOX, ic, re.I):
                    types.append(ic.upper())
                if not qty:
                    qty = n(infer_qty, 0)
                if types and not qty:
                    qty = 1
                oc = port_cc(opc)
                dc = port_cc(dpc)
                io = 0
                if oc == "CN" and dc and dc != "CN":
                    io = 1
                elif dc == "CN" and oc and oc != "CN":
                    io = 2
                elif not oc and dc and dc != "CN":
                    io = 1
                elif not oc and dc == "CN":
                    io = 2
                elif oc == "CN" and dc == "CN":
                    io = n(infer_io, 0)
                elif oc and dc and oc != "CN" and dc != "CN":
                    io = n(infer_io, 0)
                else:
                    io = n(infer_io, 0)
                if io not in (1, 2):
                    io = 1
                rate = s(infer_rate).upper()
                if rate not in RATE_ENUM:
                    rate = ""
                computed = pick_rate(logi, io, blob_text, svc, types, has_cbm or has_ton, infer_rate)
                if logi == "AIR" and io == 2:
                    rate = ""
                elif logi in ("ROAD", "MULTIMODAL"):
                    rate = ""
                elif computed:
                    rate = computed
                elif rate == "AIR_EXPORT" and io == 2:
                    rate = ""
                if logi == "SEA" and rate not in RATE_ENUM:
                    rate = "FCL_EXPORT" if io == 1 else "FCL_IMPORT"
                skip = 0 if rate in RATE_ENUM else 1
                if logi == "AIR" and io == 2:
                    skip = 1
                    rate = ""
                elif logi in ("ROAD", "MULTIMODAL", ""):
                    skip = 1
                    rate = ""
                spec_guessed = 0
                fcl_like = rate in (
                    "FBA", "DUAL", "PORT", "FCL_FEEDER",
                    "SPECIAL_EXPORT", "REEFER_EXPORT", "FCL_EXPORT", "FCL_IMPORT",
                )
                if skip == 0 and fcl_like and not types:
                    types = ["40HQ"]
                    spec_guessed = 1
                    if not qty:
                        qty = 1
                if skip == 0 and logi == "RAIL" and not types:
                    types = ["40HQ"]
                    spec_guessed = 1
                    if not qty:
                        qty = 1
                if skip == 0 and rate in ("LCL_EXPORT", "LCL_IMPORT") and not has_cbm and not has_ton:
                    spec_guessed = 1
                info_ins = spec_guessed
                preferred = types[0] if types else (
                    "CBM" if has_cbm or rate in ("LCL_EXPORT", "LCL_IMPORT") else ("TON" if has_ton else "")
                )
                rest = MONEY_RE.sub(" ", s(supplement))
                for token in (carrier, route_name, route_code, country, transit, schedule_note, spec_hint):
                    if token:
                        rest = rest.replace(token, " ")
                rest = re.sub(r"\s+", " ", rest).strip()
                io_zh = "出口" if io == 1 else "进口"
                rate_zh = RATE_LABEL.get(rate, logi)
                parts = [io_zh + (rate_zh or ""), op, opc, dp, dpc, s(cargo_name), spec or preferred, carrier, route_name, route_code, country, transit, schedule_note, rest]
                query = re.sub(r"\s+", " ", " ".join(p for p in parts if p)).strip()
                rate_body = {}
                if skip == 0:
                    rate_body["queryText"] = query
                    rate_body["rateType"] = rate
                    put_ports(rate_body, opc, op, dpc, dp, rate in RATE_PORT_NAME_ONLY)
                    put(rate_body, "originTerminal", origin_terminal)
                    put(rate_body, "destTerminal", dest_terminal)
                    put(rate_body, "carrier", carrier)
                    put(rate_body, "routeName", route_name)
                    put(rate_body, "routeCode", route_code)
                    put(rate_body, "country", country)
                    put(rate_body, "transitType", transit)
                    if types:
                        rate_body["containerTypes"] = types
                order_body = {"queryText": query, "ioDirection": io, "top": 8}
                put(order_body, "logisticsType", logi)
                put_ports(order_body, opc, op, dpc, dp, False)
                bt = biz_of(logi, io)
                put(order_body, "bizType", bt)
                if types:
                    order_body["containerType"] = types[0]
                charge_body = {}
                skip_charge = 1
                if logi:
                    charge_body = {"logisticsType": logi, "ioDirection": io}
                    skip_charge = 0
                analyzed = {
                    "ioDirection": io,
                    "ioDirectionLabel": io_zh,
                    "logisticsType": logi,
                    "rateType": rate,
                    "rateTypeLabel": RATE_LABEL.get(rate, ""),
                    "queryText": query,
                    "containerTypes": types,
                    "selectedSpec": preferred,
                    "quantity": qty,
                    "skipRate": bool(skip),
                    "specGuessed": bool(spec_guessed),
                    "carrier": carrier,
                    "routeName": route_name,
                    "country": country,
                    "transitType": transit,
                }
                return {
                    "io_direction": io,
                    "logistics_type": logi,
                    "rate_type": rate,
                    "biz_type": bt or "",
                    "query_text": query,
                    "container_types_json": json.dumps(types, ensure_ascii=False),
                    "quantity": qty,
                    "skip_rate": skip,
                    "skip_charge": skip_charge,
                    "info_insufficient": info_ins,
                    "spec_guessed": spec_guessed,
                    "rate_body": json.dumps(rate_body, ensure_ascii=False),
                    "order_body": json.dumps(order_body, ensure_ascii=False),
                    "charge_body": json.dumps(charge_body, ensure_ascii=False),
                    "analyzed_json": json.dumps(analyzed, ensure_ascii=False),
                }
          variables:
