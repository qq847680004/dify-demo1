      - id: pack_context
        type: custom
        data:
          type: code
          title: "打包召回上下文"
          code_language: python3
          code: |
            import json
            import re

            DROP = re.compile(r"(cost|buyprice|buy_price|costcbm|cost20|cost40|sell20gp|pricen)$", re.I)
            MAX_LEN = 80000


            def unwrap(raw):
                if raw is None:
                    return {}
                if isinstance(raw, dict):
                    obj = raw
                else:
                    text = str(raw).strip()
                    if not text:
                        return {}
                    try:
                        obj = json.loads(text)
                    except Exception:
                        return {}
                if not isinstance(obj, dict):
                    return {}
                data = obj.get("data")
                return data if isinstance(data, dict) else obj


            def strip_obj(v):
                if isinstance(v, dict):
                    out = {}
                    for k, val in v.items():
                        if DROP.search(str(k).replace("_", "")):
                            continue
                        out[k] = strip_obj(val)
                    return out
                if isinstance(v, list):
                    return [strip_obj(i) for i in v]
                return v


            def hits_of(data):
                hits = data.get("hits")
                return hits if isinstance(hits, list) else []


            def main(
                rates_body: str = "",
                orders_body: str = "",
                charges_body: str = "",
                fx_body: str = "",
                analyzed_json: str = "",
                skip_rate: float = 0,
                info_insufficient: float = 0,
            ) -> dict:
                rates = unwrap(rates_body)
                orders = unwrap(orders_body)
                charges = unwrap(charges_body)
                try:
                    fx = json.loads(fx_body or "{}")
                except Exception:
                    fx = {}
                if not isinstance(fx, dict):
                    fx = {}
                try:
                    analyzed = json.loads(analyzed_json or "{}")
                except Exception:
                    analyzed = {}
                if not isinstance(analyzed, dict):
                    analyzed = {}
                rh = [strip_obj(h) for h in hits_of(rates)[:1] if isinstance(h, dict)]
                oh = []
                for h in hits_of(orders):
                    if isinstance(h, dict):
                        oh.append(strip_obj(h))
                    if len(oh) >= 8:
                        break
                items = charges.get("items")
                if not isinstance(items, list):
                    items = []
                items = [strip_obj(i) for i in items if isinstance(i, dict)]
                usd = fx.get("usd") if isinstance(fx.get("usd"), dict) else fx
                ctx = {
                    "analyzed": analyzed,
                    "rateHit": rh[0] if rh else None,
                    "orderHits": oh,
                    "chargeItems": items,
                    "chargeBusinessTypeLabel": charges.get("businessTypeLabel") or "",
                    "fxUsd": usd if isinstance(usd, dict) else {},
                    "skipRate": bool(int(float(skip_rate or 0))),
                    "infoInsufficient": bool(int(float(info_insufficient or 0))),
                    "rules": {
                        "useOnlyFirstRateHit": True,
                        "noSecondRateSearch": True,
                        "noCompetitor": True,
                        "chargeDirOnlyReceivable": 1,
                    },
                }
                text = json.dumps(ctx, ensure_ascii=False)
                if len(text) > MAX_LEN:
                    ctx["orderHits"] = oh[:4]
                    text = json.dumps(ctx, ensure_ascii=False)
                    if len(text) > MAX_LEN:
                        text = text[:MAX_LEN]
                recall_ok = 1 if (rh or oh or items) else 0
                return {
                    "context_json": text,
                    "fx_json": json.dumps(usd if isinstance(usd, dict) else {}, ensure_ascii=False),
                    "recall_ok": recall_ok,
                }
          variables:
            - variable: rates_body
              value_selector: [agg_rates, output]
            - variable: orders_body
              value_selector: [agg_orders, output]
            - variable: charges_body
              value_selector: [agg_charges, output]
            - variable: fx_body
              value_selector: [agg_fx, output]
            - variable: analyzed_json
              value_selector: [assemble, analyzed_json]
            - variable: skip_rate
              value_selector: [assemble, skip_rate]
            - variable: info_insufficient
              value_selector: [assemble, info_insufficient]
          outputs:
            context_json:
              type: string
              children: null
            fx_json:
              type: string
              children: null
            recall_ok:
              type: number
        position: {x: 3340, y: 360}
        positionAbsolute: {x: 3340, y: 360}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: synthesize
        type: custom
        data:
          type: llm
          title: "合成报价草案"
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.7-plus
            mode: chat
            completion_params:
              temperature: 0.1
              enable_thinking: false
          prompt_template:
            - id: synth-system
              role: system
              text: |
                你是货代报价合成器。只输出一个 JSON 对象，不要 Markdown 围栏，不要解释。competitorHint 必须是 JSON null。禁止编造金额、禁止写订单号进 fees[].remark、禁止汇率按 1 硬比、禁止从多条运价 hits 拼金额。

                输入是 pack_context.context_json：analyzed、rateHit（至多 hits[0]，含完整 specPrices 与 extras）、orderHits（每条 fees[] 全留）、chargeItems（全部目录）、fxUsd（USD 为 1 时对其它币的汇率）、skipRate、infoInsufficient。

                【规格价选档】对主表与每条 extra 各自对 specPrices[]，对照 analyzed.selectedSpec / cargo 规格 / spec_hint：
                1. 精确：规格代码全等（40HQ=40HQ）
                2. 别名：高柜→40HQ，平柜→40GP，开顶→OT 族，框架→FR 族，冷冻→RF 族
                3. 同族近档（仅上一步没有时）：40HQ↔40GP↔40NOR；20GP 不升到 40；OT 不配 GP；拼箱在 CBM/TON/MIN 里按原文单位选，空则 CBM；空运按计费重靠最近重量档（N/+45/+100…），就近不跨到柜型
                4. 仍没有可对的同族 → 该行金额 0、selectedFlag=0，不得用清单第一档凑数
                5. 近档（非精确）时该主运行 needVerify=true，remark 注明「规格按 {selectedSpec} 近似」
                6. analyzed.specGuessed=true（默认猜的 40HQ/CBM）时主运行 needVerify=true，remark 含「规格按 {selectedSpec} 默认」，hint 追加「请提供更详细的询价信息（港口、运输方式、箱型/货量、品名等），以获得更精准的报价。」
                把最终档写入 analyzed.selectedSpec。

                【算费】
                1. 有有效运价：只用 rateHit。主运费与 extras 都从该行 specPrices 选最相似一档。关联费用按 feeKindLabel 分种类，再按 feeName 对齐费用项；无规格价则用 unitPrice/perBill。未匹配种类没有行，不要当成漏报价。不同种类禁止合成一行。同一 chargeCode/规范化中文名禁止两行。
                2. 无运价有历史：金额来自相似单 fees[]（chargeCode=feeCode 优先，其次规范化中文名），必须声明仅供参考。禁止同义词猜（THC ≠ 目的港操作费）。每条 hit 的 fees[] 全部列出。
                3. 两边都有：报价仍按这一条运价；侧边仍列出该条市场运价与全部相似单；每项一行涨跌。
                4. 两边都无（含 skipRate 未调接口、或调了 hits 空）：fees=[]，hint 用「请补充运价中心的数据或联系管理员。」
                5. 目录有、运价/历史都没有的项：可按目录名补一行，sourceType=DIFY，needVerify=true，remark 含「参考价格，请核实」，金额禁止臆造——无依据则 unitPrice=0 且 selectedFlag=0；hint 追加「{费用名} 在系统历史报价有缺项，已动态填补，请核对。」。用 chargeItems 全部。
                6. 涨跌：每项一行；模型自选对照哪张历史单；相对差绝对值≥10% 为差距巨大；每一张都巨大则改对 top1 并加差价提示。只比历史应收（feeDirection=1）。先折同规格（单价×询价箱量 ↔ 历史同柜型金额）。币种不同先用 fxUsd 再比；换汇后的涨跌句写出所用汇率与日期；换不到该项不写涨跌、金额照报。对不上费用名 →「历史无此项，无法对照」。不得因历史没有就删掉运价项。
                7. All-in / 到港：仍按费用项逐行报，不发明一口价合并行。
                8. quantity：柜型费用用 analyzed.quantity；票结（提单费等）用 1。
                9. sourceType：运价主表/关联费用 RATE；历史 HISTORY；目录补缺 DIFY。不要 MANUAL。
                10. totalAmount：只加 selectedFlag=1 且 unitPrice>0 的行；totalCurrency 优先运价币种，否则 USD。
                11. 费用来源写入 fees[].remark：运价主表「来源=运价中心 {rateId} {rateTypeLabel} {spec}」；关联费用「来源=运价中心 {rateId} {feeKindLabel} {feeName} extraId={extraId}」；历史「来源=相似订单明细 {feeName} {amount}{currency}/{单位}」。禁止写订单号。
                12. 指定船司/航线未命中（analyzed.carrier/routeName 有值但 rateHit 对应字段不一致）时 hint 追加「未命中指定船司/航线，已按同港有效运价报价，请核对。」且 needVerify=true。不要因此改报空。
                13. 任一项或合计相对差≥10% 才追加「与相似历史案例差价较大，请复核后再对外报价。」

                【hint 原文】
                两边都有：本次费用按运价中心当前有效运价生成（最新运价）。匹配到的市场运价与相似历史单均已列出；报价金额以市场运价为准。每个费用项只报一行。
                只有市场运价：本次费用按运价中心当前有效运价生成（最新运价）。未匹配到足够相似的历史关闭单，故无上浮/下跌对照。
                只有相似历史单：当前没有匹配的最新运价，本次费用按相似历史订单报价生成，仅供参考。建议在运价中心补充有效运价或联系管理员。
                未调有效运价接口或 hits 空（无论有无历史以外的两边都无）：请补充运价中心的数据或联系管理员。有历史时仍用上面「只有相似历史单」整句。
                有运价且 specGuessed：在对应运价 hint 后追加「请提供更详细的询价信息（港口、运输方式、箱型/货量、品名等），以获得更精准的报价。」

                【marketRates】来自 rateHit：unitPrice=选档 amount（无同族则 0）；containerType=analyzed.selectedSpec；priceText=$+千分位单价+/+箱型；rateDate=effectiveDate 或 updateTime 日期；trend 相对本次主运费单价：高上涨、低下跌、否则持平，无法比则空串；rateId=bizId；carrier=carrier。至多 1 条。
                【similarQuotes】来自 orderHits 全部：quoteNo=bizNo；dealDate=updateTime 日期否则 etd；inquiryStatusLabel 固定「已成交」；summary={originPortCode}-{destPortCode} {cargoSpec或箱型} {第一条应收费用名} {amount}{currency}。

                【steps】三步恒在，HTTP 失败仍 progress=done。仅当你无法输出对象时由下游标 LLM failed。

                短例1（有运价精确档）：{"analyzed":{"ioDirection":1,"ioDirectionLabel":"出口","logisticsType":"SEA","rateType":"FCL_EXPORT","rateTypeLabel":"出口整箱","queryText":"出口整箱 宁波 CNNGB 洛杉矶 USLAX 定制家具 2x40HQ","containerTypes":["40HQ"],"selectedSpec":"40HQ","quantity":2,"skipRate":false,"carrier":"","routeName":"","country":"","transitType":""},"steps":[{"code":"RECALL","name":"检索召回","progress":"done","detail":"匹配运价中心有效运价 + 相似历史成交文案"},{"code":"RULES","name":"规则引擎","progress":"done","detail":"按运输方式与进出口列出应报费用项，校验计费单位"},{"code":"LLM","name":"LLM 合成","progress":"done","detail":"生成预填报价单草稿并注明依据"}],"fees":[{"feeName":"海运费","unitPrice":2480.0,"quantity":2.0,"currencyCode":"USD","amount":4960.0,"remark":"来源=运价中心 R1 出口整箱 40HQ","sourceType":"RATE","chargeUnit":"柜","requiredFlag":1,"selectedFlag":1,"needVerify":false,"trendText":""}],"totalAmount":4960.0,"totalCurrency":"USD","hint":"本次费用按运价中心当前有效运价生成（最新运价）。未匹配到足够相似的历史关闭单，故无上浮/下跌对照。","marketRates":[{"priceText":"$2,480/40HQ","rateDate":"2024-07-01","trend":"持平","unitPrice":2480.0,"containerType":"40HQ","carrier":"","rateId":"R1"}],"similarQuotes":[],"competitorHint":null}

                短例2（仅历史）：fees 的 sourceType=HISTORY，remark 不含订单号，hint 含「仅供参考」，competitorHint 为 null。
